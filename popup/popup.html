<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuestionAI</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <div class="logo-wrapper"><img src="logo.svg" alt="QuestionAI Logo" style="height: 24px;"></div>
      <label class="switch" title="Ativar/Desativar detecção">
        <input type="checkbox" id="toggle-enabled" checked>
        <span class="slider round"></span>
      </label>
    </header>

    <main class="popup-body">
      <div class="stats-card">
        <div class="stat-item">
          <span class="stat-val" id="stat-scanned">0</span>
          <span class="stat-label">Analisadas</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-item">
          <span class="stat-val alert" id="stat-detected">0</span>
          <span class="stat-label">Clickbaits</span>
        </div>
      </div>

      <div class="site-toggle-container" style="margin-bottom: 12px;">
        <button type="button" id="btn-toggle-site" class="btn-secondary" style="width: 100%; padding: 8px;">
          Desativar neste site
        </button>
      </div>

      
      <section class="config-section" id="config-section" style="display: none;">

        <label for="api-url" class="field-label">URL da API / Servidor:</label>
        <div class="input-group">
          <input type="text" id="api-url" placeholder="https://clickbait-api.onrender.com" spellcheck="false">
        </div>

        <div class="preset-buttons">
          <button type="button" class="btn-preset" id="preset-local">Local (8000)</button>
          <button type="button" class="btn-preset" id="preset-hf">Render Nuvem</button>
        </div>

        <div class="action-buttons">
          <button type="button" class="btn-primary" id="btn-save">Salvar Configuração</button>
          <button type="button" class="btn-secondary" id="btn-test">Testar API</button>
        </div>
      </section>

      <div class="status-indicator" id="status-box">
        <span class="status-dot" id="status-dot"></span>
        <span class="status-text" id="status-text">Verificando status do servidor...</span>
      </div>
    </main>

    <footer class="popup-footer" style="display: flex; justify-content: space-between; align-items: center;">
      <span>Versão 1.0.0</span>
      <button type="button" id="btn-settings-toggle" style="background: none; border: none; color: inherit; font-size: 11px; cursor: pointer; padding: 2px 4px; border-radius: 4px;" title="Configurações Avançadas">⚙️ Config</button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
