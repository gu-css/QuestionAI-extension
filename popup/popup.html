<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuestionAI</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <div class="logo-wrapper"><img src="logo.svg" alt="QuestionAI Logo" style="height: 24px;"></div>
      <label class="switch" title="Ativar/Desativar detecção">
        <input type="checkbox" id="toggle-enabled" checked>
        <span class="slider round"></span>
      </label>
    </header>

    <main class="popup-body">
      <div class="stats-grid" style="grid-template-columns: 1fr 1fr;">
        <div class="stat-item">
          <span class="stat-val" id="stat-scanned">0</span>
          <span class="stat-label">Analisadas</span>
        </div>
        <div class="stat-item">
          <span class="stat-val alert" id="stat-detected">0</span>
          <span class="stat-label">Clickbaits</span>
        </div>
      </div>

      <div class="site-toggle-container" style="margin-bottom: 12px;">
        <button type="button" id="btn-toggle-site" class="btn-secondary" style="width: 100%; padding: 8px;">
          Desativar neste site
        </button>
      </div>

      
      <section class="config-section" id="config-section" style="display: none; gap: 16px;">
      
        <div class="status-indicator" id="status-box" style="border: none; background: var(--color-btn-sec-bg); padding: 8px 12px; border-radius: 6px;">
          <span class="status-dot" id="status-dot"></span>
          <span class="status-text" id="status-text">Verificando status...</span>
        </div>

        <div class="config-group">
          <label for="threshold-slider" class="field-label">Sensibilidade de Detecção:</label>
          <div class="input-group" style="display: flex; align-items: center; gap: 12px; margin-top: 8px;">
            <input type="range" id="threshold-slider" min="0" max="100" value="75" style="flex: 1; padding: 0; background: transparent; border: none; height: 18px; cursor: pointer;">
            <span id="threshold-val" style="font-weight: 700; width: 36px; text-align: right; font-size: 13px; color: var(--color-primary);">75%</span>
          </div>
        </div>

        <div class="config-group">
          <label for="api-url" class="field-label">URL da API / Servidor:</label>
          <div class="input-group" style="margin-top: 8px; margin-bottom: 8px;">
            <input type="text" id="api-url" placeholder="https://clickbait-api.onrender.com" spellcheck="false" style="padding: 10px 12px;">
          </div>
          <div class="preset-buttons" style="display: flex; gap: 8px;">
            <button type="button" class="btn-preset" id="preset-local" style="padding: 8px; border-radius: 6px;">Local (8000)</button>
            <button type="button" class="btn-preset" id="preset-hf" style="padding: 8px; border-radius: 6px;">Render Nuvem</button>
          </div>
        </div>

        <div class="action-group" style="display: flex; flex-direction: column; gap: 8px; margin-top: 4px; padding-top: 16px; border-top: 1px solid var(--color-border);">
          <div class="action-buttons" style="display: flex; gap: 8px; margin: 0;">
            <button type="button" class="btn-primary" id="btn-save" style="flex: 2;">Salvar Configurações</button>
            <button type="button" class="btn-secondary" id="btn-test" style="flex: 1;">Testar API</button>
          </div>
          <button type="button" class="btn-secondary" id="btn-clear-cache" style="width: 100%; border-color: var(--color-secondary); color: var(--color-secondary);">Limpar Cache</button>
        </div>
      </section>
    </main>

    <footer class="popup-footer" style="display: flex; justify-content: space-between; align-items: center;">
      <span>Versão 1.0.0</span>
      <button type="button" id="btn-settings-toggle" style="background: none; border: none; color: inherit; font-size: 12px; font-weight: 600; cursor: pointer; padding: 4px 6px; border-radius: 4px;" title="Configurações Avançadas">Configurações</button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
